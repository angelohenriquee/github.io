<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Experiência Fotográfica</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main
    id="experience"
    class="experience"
  >


    <!-- ==================================================
         BARRAS DOS STORIES
         Ficam ocultas durante o login.
    =================================================== -->

    <div
      id="storyProgress"
      class="story-progress"
      aria-hidden="true"
    >

      <div
        class="story-segment"
        data-segment="0"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="1"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="2"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="3"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="4"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="5"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="6"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="7"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="8"
      >
        <span class="story-fill"></span>
      </div>

    </div>



    <!-- ==================================================
         ÁREA VERTICAL
    =================================================== -->

    <div
      id="storyStage"
      class="story-stage"
    >


      <!-- =================================================
           LOGIN
      ================================================== -->

      <section
        class="scene scene-login active"
        data-scene="0"
        data-login="true"
      >

        <video
          id="loginVideo"
          class="scene-video"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="login.mp4"
            type="video/mp4"
          >

        </video>


        <div
          class="login-panel"
        >

          <input
            id="password"
            class="ui-box"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Senha"
            aria-label="Senha"
          >


          <button
            id="enterButton"
            class="ui-box ui-button"
            type="button"
          >
            Entrar
          </button>


          <div
            id="passwordError"
            class="password-error"
          >
            Senha incorreta.
          </div>

        </div>

      </section>



      <!-- =================================================
           STORY 1
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="1"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 1.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 2
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="2"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 2.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 3
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="3"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="claridade.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 4
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="4"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="contraste.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 5
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="5"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="controle.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 6
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="6"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="incluidos.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 7
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="7"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="investimento.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 8
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="8"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="encerramento.mp4"
            type="video/mp4"
          >

        </video>

      </section>


    </div>



    <!-- ==================================================
         ÁREAS DE INTERAÇÃO
         Só ficam ativas depois do login.
    =================================================== -->

    <div
      id="storyControls"
      class="story-controls"
      aria-hidden="true"
    >

      <div
        id="storyPrev"
        class="story-hit-area story-prev"
      ></div>

      <div
        id="storyPause"
        class="story-hit-area story-pause"
      ></div>

      <div
        id="storyNext"
        class="story-hit-area story-next"
      ></div>

    </div>



    <!-- ==================================================
         TRANSIÇÃO
    =================================================== -->

    <div
      id="blackTransition"
      class="black-transition"
      aria-hidden="true"
    ></div>


  </main>


  <script src="script.js"></script>

</body>

</html>

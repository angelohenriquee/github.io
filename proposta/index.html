<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>Experiência Fotográfica</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main
    id="experience"
    class="experience"
    aria-label="Experiência fotográfica"
  >


    <!-- =====================================================
         TELA 1 — LOGIN
         Não possui função de pressionar para pausar
    ====================================================== -->

    <section
      class="scene scene-login active"
      data-scene="0"
      data-login="true"
    >

      <video
        class="scene-video"
        autoplay
        muted
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >

        <source
          src="login.mp4"
          type="video/mp4"
        >

      </video>


      <div
        class="login-panel"
        aria-label="Acesso à proposta"
      >

        <input
          id="password"
          class="ui-box"
          type="password"
          inputmode="text"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Senha"
          aria-label="Senha"
        >


        <button
          id="enterButton"
          class="ui-box ui-button"
          type="button"
        >
          Entrar
        </button>


        <div
          id="passwordError"
          class="password-error"
          role="alert"
          aria-live="polite"
        >
          Senha incorreta.
        </div>

      </div>

    </section>



    <!-- =====================================================
         TELA 2 — PERGUNTA
    ====================================================== -->

    <section
      class="scene"
      data-scene="1"
      data-pausable="true"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
        webkit-playsinline
        disablepictureinpicture
        controlslist="nodownload nofullscreen noremoteplayback"
      >

        <source
          src="tela 1.mp4"
          type="video/mp4"
        >

      </video>


      <div
        class="end-frame"
        aria-hidden="true"
      ></div>

    </section>



    <!-- =====================================================
         TELA 3 — PENSAMENTO / ESCRITA
    ====================================================== -->

    <section
      class="scene"
      data-scene="2"
      data-pausable="true"
    >

      <video
        class="scene-video"
        preload="auto"

        disablepictureinpicture
        controlslist="nodownload nofullscreen noremoteplayback"

          type="video/mp4"
        >

      </video>


      <div
        class="end-frame"
        aria-hidden="true"
      ></div>

    </section>

    ====================================================== -->

      >

    </section>

      </video>


      <div

        aria-hidden="true"
      ></div>

    </section>

    </section>

    >

      <video

      </video>


      <div
        class="end-frame"
        aria-hidden="true"
      ></div>

    </section>



    <!-- =====================================================
         NAVEGAÇÃO
    ====================================================== -->

    <nav
      id="navigation"
      class="navigation"
      aria-label="Navegação da proposta"
    >

      <button
        id="backButton"
        class="nav-button nav-back"
        type="button"
      >
        Voltar
      </button>


      <button
        id="nextButton"
        class="nav-button nav-next"
        type="button"
      >
        Avançar
      </button>

    </nav>



    <!-- =====================================================
         CAMADA PRETA PARA A TRANSIÇÃO FINAL
    ====================================================== -->

    <div
      id="blackTransition"
      class="black-transition"
      aria-hidden="true"
    ></div>

  </main>


  <script src="script.js"></script>

</body>

</html>

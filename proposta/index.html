<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Experiência Fotográfica</title>


  <!-- Poppins -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================================
       EXPERIÊNCIA
  ====================================================== -->

  <main
    id="experience"
    class="experience"
    aria-label="Experiência fotográfica"
  >


    <!-- ===================================================
         BARRAS DE PROGRESSO

         9 barras = 9 vídeos

         A barra do vídeo atual mostra o progresso.
         As anteriores ficam completas.
         As próximas ficam vazias.
    ==================================================== -->

    <div
      id="storyProgress"
      class="story-progress"
      aria-hidden="true"
    >

      <div
        class="story-segment"
        data-segment="0"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="1"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="2"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="3"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="4"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="5"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="6"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="7"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="8"
      >
        <span class="story-fill"></span>
      </div>

    </div>


    <!-- ===================================================
         ÁREA PRINCIPAL DOS STORIES

         A navegação lateral será invisível:
         esquerda = anterior
         direita = próxima
         centro = segurar para pausar
    ==================================================== -->

    <div
      id="storyStage"
      class="story-stage"
    >


      <!-- =================================================
           TELA 0 — LOGIN
           
           Não participa do comportamento de segurar.
      ================================================== -->

      <section
        class="scene scene-login active"
        data-scene="0"
        data-login="true"
      >

        <video
          id="loginVideo"
          class="scene-video"
          autoplay
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="login.mp4"
            type="video/mp4"
          >

        </video>


        <!-- Login -->

        <div
          class="login-panel"
          aria-label="Acesso à proposta"
        >

          <input
            id="password"
            class="ui-box"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Senha"
            aria-label="Senha"
          >


          <button
            id="enterButton"
            class="ui-box ui-button"
            type="button"
          >
            Entrar
          </button>


          <div
            id="passwordError"
            class="password-error"
            role="alert"
            aria-live="polite"
          >
            Senha incorreta.
          </div>

        </div>

      </section>



      <!-- =================================================
           STORY 1
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="1"
        data-story="1"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 1.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 2
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="2"
        data-story="2"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 2.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 3 — CLARIDADE
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="3"
        data-story="3"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="claridade.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 4 — CONTRASTE
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="4"
        data-story="4"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="contraste.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 5 — CONTROLE
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="5"
        data-story="5"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="controle.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 6 — INCLUÍDO
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="6"
        data-story="6"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="incluidos.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 7 — INVESTIMENTO
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="7"
        data-story="7"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="investimento.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- =================================================
           STORY 8 — ENCERRAMENTO
      ================================================== -->

      <section
        class="scene story-scene"
        data-scene="8"
        data-story="8"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="encerramento.mp4"
            type="video/mp4"
          >

        </video>

      </section>


    </div>


    <!-- =====================================================
         ÁREAS DE TOQUE

         São invisíveis.

         ESQUERDA:
         volta

         DIREITA:
         avança

         CENTRO:
         segurar = pausa

         O centro ocupa a maior área para reproduzir
         naturalmente o comportamento dos Stories.
    ====================================================== -->

    <div
      id="storyControls"
      class="story-controls"
      aria-hidden="true"
    >

      <div
        id="storyPrev"
        class="story-hit-area story-prev"
      ></div>


      <div
        id="storyPause"
        class="story-hit-area story-pause"
      ></div>


      <div
        id="storyNext"
        class="story-hit-area story-next"
      ></div>

    </div>


    <!-- =====================================================
         TRANSIÇÃO PARA PRETO
    ====================================================== -->

    <div
      id="blackTransition"
      class="black-transition"
      aria-hidden="true"
    ></div>


  </main>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script
    src="script.js"
  ></script>


</body>

</html>

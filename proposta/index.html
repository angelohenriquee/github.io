<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Experiência Fotográfica</title>


  <!-- Poppins Regular -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >


  <!-- CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main
    id="experience"
    class="experience"
  >


    <!-- =====================================================
         BARRAS DOS STORIES

         SOMENTE os 8 Stories possuem barras.

         Login e tela "Começar" ficam fora delas.
    ====================================================== -->

    <div
      id="storyProgress"
      class="story-progress"
      aria-hidden="true"
    >

      <div
        class="story-segment"
        data-segment="0"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="1"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="2"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="3"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="4"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="5"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="6"
      >
        <span class="story-fill"></span>
      </div>

      <div
        class="story-segment"
        data-segment="7"
      >
        <span class="story-fill"></span>
      </div>

    </div>


    <!-- =====================================================
         QUADRO PRINCIPAL 9:16
    ====================================================== -->

    <div
      id="storyStage"
      class="story-stage"
    >


      <!-- ===================================================
           TELA 0 — LOGIN

           Vídeo em loop.
           Sem barras.
           Sem interação de Stories.
      ==================================================== -->

      <section
        class="scene scene-login active"
        data-scene="0"
        data-type="login"
      >

        <video
          id="loginVideo"
          class="scene-video"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="login.mp4"
            type="video/mp4"
          >

        </video>


        <div
          class="login-panel"
        >

          <input
            id="password"
            class="ui-box"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Senha"
            aria-label="Senha"
          >


          <button
            id="enterButton"
            class="ui-box ui-button"
            type="button"
          >
            Entrar
          </button>


          <div
            id="passwordError"
            class="password-error"
            role="alert"
            aria-live="polite"
          >
            Senha incorreta.
          </div>

        </div>

      </section>



      <!-- ===================================================
           TELA 1 — COMEÇAR

           Tela preta.
           Sem barras.
           Sem Stories.

           O botão usa exatamente a mesma
           linguagem visual do "Entrar".
      ==================================================== -->

      <section
        class="scene start-screen"
        data-scene="1"
        data-type="start"
      >

        <div
          class="start-panel"
        >

          <button
            id="startButton"
            class="ui-box ui-button start-button"
            type="button"
          >
            Começar
          </button>

        </div>

      </section>



      <!-- ===================================================
           TELA 2 — STORY 1
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="2"
        data-story="1"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 1.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 3 — STORY 2
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="3"
        data-story="2"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 2.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 4 — STORY 3
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="4"
        data-story="3"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="claridade.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 5 — STORY 4
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="5"
        data-story="4"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="contraste.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 6 — STORY 5
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="6"
        data-story="5"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="controle.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 7 — STORY 6
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="7"
        data-story="6"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="incluidos.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 8 — STORY 7
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="8"
        data-story="7"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="investimento.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           TELA 9 — STORY 8
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="9"
        data-story="8"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="encerramento.mp4"
            type="video/mp4"
          >

        </video>

      </section>


    </div>



    <!-- =====================================================
         ÁREAS INVISÍVEIS DOS STORIES

         Só ficam ativas quando a pessoa
         já estiver dentro do primeiro Story.
    ====================================================== -->

    <div
      id="storyControls"
      class="story-controls"
      aria-hidden="true"
    >

      <div
        id="storyPrev"
        class="story-hit-area story-prev"
      ></div>


      <div
        id="storyPause"
        class="story-hit-area story-pause"
      ></div>


      <div
        id="storyNext"
        class="story-hit-area story-next"
      ></div>

    </div>


  </main>


  <script
    src="script.js"
  ></script>

</body>

</html>

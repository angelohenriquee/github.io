<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>Experiência Fotográfica</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >


  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main
    id="experience"
    class="experience"
  >


    <!-- =====================================================
         BARRAS DOS STORIES
    ====================================================== -->

    <div
      id="storyProgress"
      class="story-progress"
      aria-hidden="true"
    >

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

      <div class="story-segment">
        <span class="story-fill"></span>
      </div>

    </div>



    <!-- =====================================================
         QUADRO PRINCIPAL 9:16
    ====================================================== -->

    <div
      id="storyStage"
      class="story-stage"
    >


      <!-- ===================================================
           LOGIN
      ==================================================== -->

      <section
        class="scene scene-login active"
        data-scene="0"
      >

        <video
          id="loginVideo"
          class="scene-video"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="login.mp4"
            type="video/mp4"
          >

        </video>


        <div
          class="login-panel"
        >

          <input
            id="password"
            class="ui-box"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="Senha"
            aria-label="Senha"
          >


          <button
            id="enterButton"
            class="ui-box ui-button"
            type="button"
          >
            Entrar
          </button>


          <div
            id="passwordError"
            class="password-error"
            role="alert"
            aria-live="polite"
          >
            Senha incorreta.
          </div>

        </div>

      </section>



      <!-- ===================================================
           ABERTURA 3 × C
      ==================================================== -->

      <section
        class="scene start-screen"
        data-scene="1"
      >

        <video
          id="startVideo"
          class="scene-video start-video"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="3xc.mp4"
            type="video/mp4"
          >

        </video>


        <div
          class="start-panel"
        >

          <button
            id="startButton"
            class="ui-box ui-button start-button"
            type="button"
          >
            Começar
          </button>

        </div>

      </section>



      <!-- ===================================================
           STORY 1
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="2"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 1.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 2
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="3"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="tela 2.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 3
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="4"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="claridade.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 4
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="5"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="contraste.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 5
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="6"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="controle.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 6
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="7"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="incluidos.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 7
      ==================================================== -->

      <section
        class="scene story-scene"
        data-scene="8"
      >

        <video
          class="scene-video"
          preload="auto"
          playsinline
          webkit-playsinline
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="investimento.mp4"
            type="video/mp4"
          >

        </video>

      </section>



      <!-- ===================================================
           STORY 8 — ÚLTIMO
      ==================================================== -->

      <section
        class="scene story-scene final-story"
        data-scene="9"
      >

        <video
          id="finalVideo"
          class="scene-video"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          disablepictureinpicture
          controlslist="nodownload nofullscreen noremoteplayback"
        >

          <source
            src="ultimo.mp4"
            type="video/mp4"
          >

        </video>


        <div
          id="finalPanel"
          class="final-panel"
        >

          <button
            id="whatsappButton"
            class="ui-box final-button"
            type="button"
          >
            Quero fazer parte
          </button>

        </div>

      </section>


    </div>



    <!-- =====================================================
         CONTROLES INVISÍVEIS DOS STORIES
    ====================================================== -->

    <div
      id="storyControls"
      class="story-controls"
      aria-hidden="true"
    >

      <div
        id="storyPrev"
        class="story-hit-area story-prev"
      ></div>


      <div
        id="storyPause"
        class="story-hit-area story-pause"
      ></div>


      <div
        id="storyNext"
        class="story-hit-area story-next"
      ></div>

    </div>


  </main>


  <script
    src="script.js"
  ></script>

</body>

</html>

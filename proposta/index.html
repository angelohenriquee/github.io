<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <title>Experiência Fotográfica</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="experience">

    <!-- =================================
         TELA 1 — LOGIN
    ================================== -->

    <section class="scene active" data-scene="0">

      <video
        class="scene-video"
        autoplay
        muted
        playsinline
        preload="auto"
      >
        <source src="login.mp4" type="video/mp4">
      </video>


      <div class="login-panel">

        <input
          id="password"
          class="ui-box"
          type="password"
          placeholder="Senha"
          autocomplete="off"
        >


        <button
          id="enterButton"
          class="ui-box ui-button"
          type="button"
        >
          Entrar
        </button>


        <div
          id="passwordError"
          class="password-error"
        >
          Senha incorreta.
        </div>

      </div>

    </section>


    <!-- =================================
         TELA 2 — PERGUNTA
    ================================== -->

    <section
      class="scene"
      data-scene="1"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="tela 1.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 3 — MEU VÍDEO ESCREVENDO
    ================================== -->

    <section
      class="scene"
      data-scene="2"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="tela 2.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 4 — CLARIDADE
    ================================== -->

    <section
      class="scene"
      data-scene="3"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="claridade.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 5 — CONTRASTE
    ================================== -->

    <section
      class="scene"
      data-scene="4"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="contraste.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 6 — CONTROLE
    ================================== -->

    <section
      class="scene"
      data-scene="5"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="controle.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 7 — O QUE ESTÁ INCLUÍDO
    ================================== -->

    <section
      class="scene"
      data-scene="6"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="incluidos.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 8 — INVESTIMENTO
    ================================== -->

    <section
      class="scene"
      data-scene="7"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="investimento.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         TELA 9 — ENCERRAMENTO
    ================================== -->

    <section
      class="scene"
      data-scene="8"
    >

      <video
        class="scene-video"
        preload="auto"
        playsinline
      >
        <source src="encerramento.mp4" type="video/mp4">
      </video>

    </section>


    <!-- =================================
         NAVEGAÇÃO
    ================================== -->

    <nav class="navigation">

      <button
        id="backButton"
        class="nav-button"
        type="button"
      >
        Voltar
      </button>


      <button
        id="nextButton"
        class="nav-button"
        type="button"
      >
        Avançar
      </button>

    </nav>

  </main>


  <script src="script.js"></script>

</body>
</html>
